spring:
  datasource:
    username: root
    password: 1234
    url: jdbc:mysql://localhost:3306/dianping_lab?useSSL=False
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 8
      connect-timeout: 5s
      password: 123456
        # 读超时
      timeout: 5s
        # Lettuce 客户端的配置
      lettuce:
          # 连接池配置
          pool:
            # 最小空闲连接
            min-idle: 0
            # 最大空闲连接
            max-idle: 8
            # 最大活跃连接
            max-active: 8
            # 从连接池获取连接 最大超时时间，小于等于0则表示不会超时
            max-wait: -1ms
my:
  redis:
    ttl: 72000
    cache-null: 120
